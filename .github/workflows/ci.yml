name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -e '.[dev]'
      - name: Run automated tests
        run: pytest -q
